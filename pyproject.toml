[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "data"]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle errors, F: pyflakes, I: isort, UP: pyupgrade,
# B: bugbear, C4: flake8-comprehensions
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = false
warn_unused_ignores = true
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
